<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Seamless paper texture (tiles via stitchTiles). It contains no fill colour of its own:
       only faint, transparent warm-brown grain, fibres and mottling, so it sits on top of
       any background colour without changing it. -->
  <defs>
    <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="3" seed="23" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.17  0 0 0 0 0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0 0.04 0.12"/></feComponentTransfer>
    </filter>
    <filter id="fibres" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.11" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="luminanceToAlpha" result="l"/>
      <feComponentTransfer in="l"><feFuncA type="table" tableValues="0 0 0 0 0 0.03 0.11 0.2"/></feComponentTransfer>
      <feComposite in="SourceGraphic" operator="in"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="luminanceToAlpha" result="l"/>
      <feComponentTransfer in="l"><feFuncA type="table" tableValues="0 0 0.06 0.17"/></feComponentTransfer>
      <feComposite in="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="320" height="320" fill="#5a4730" filter="url(#mottle)"/>
  <rect width="320" height="320" fill="#5a4730" filter="url(#fibres)"/>
  <rect width="320" height="320" fill="#4a3a26" filter="url(#grain)"/>
</svg>
