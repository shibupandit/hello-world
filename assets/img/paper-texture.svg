<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Seamless paper texture v2 (tiles via stitchTiles). No mottling layer, so there are no
       dark patches: only an even, very faint warm grain plus soft paper fibres, fully
       transparent elsewhere, so it sits on any background colour without changing it. -->
  <defs>
    <filter id="fibres" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.16" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="luminanceToAlpha" result="l"/>
      <feComponentTransfer in="l"><feFuncA type="table" tableValues="0 0 0 0 0 0.015 0.05 0.08"/></feComponentTransfer>
      <feComposite in="SourceGraphic" operator="in"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="11" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="luminanceToAlpha" result="l"/>
      <feComponentTransfer in="l"><feFuncA type="table" tableValues="0 0 0.03 0.08"/></feComponentTransfer>
      <feComposite in="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#6b5538" filter="url(#fibres)"/>
  <rect width="256" height="256" fill="#5a4730" filter="url(#grain)"/>
</svg>
