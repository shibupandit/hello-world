name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk Horizon-Launcher.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Launcher
          path: Horizon-Launcher.apk

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Horizon Launcher (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: Horizon-Launcher.apk
          body: |
            Open this page on your phone, tap **Horizon-Launcher.apk** to download, then open it to install.
            Built from `${{ github.ref_name }}` @ `${{ github.sha }}`.
