name: Fetch website logo candidates

on:
  push:
    paths:
      - '.github/workflows/fetch-logo.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Find and dump logo candidates
        shell: python
        run: |
          import base64, re, urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"}
          base = "https://thugtv.online/"
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read()
          html = get(base).decode("utf-8", "replace")
          head = html[: html.lower().find("</head>") + 7] if "</head>" in html.lower() else html[:20000]
          print("=== HEAD ===")
          print(head[:15000])
          urls = []
          for tag in re.findall(r"<(?:link|meta|img)[^>]+>", html, re.I):
              low = tag.lower()
              if any(k in low for k in ("icon", "og:image", "logo", "twitter:image")):
                  m = re.search(r'(?:href|content|src)=["\']([^"\']+)["\']', tag, re.I)
                  if m and not m.group(1).startswith("data:"):
                      urls.append(urllib.parse.urljoin(base, m.group(1)))
          urls += [urllib.parse.urljoin(base, p) for p in ("/favicon.ico", "/apple-touch-icon.png")]
          seen = set()
          for u in urls:
              if u in seen:
                  continue
              seen.add(u)
              try:
                  data = get(u)
              except Exception as e:
                  print("FAIL", u, e)
                  continue
              print(f"=== IMG {u} {len(data)} ===")
              b = base64.b64encode(data).decode()
              for i in range(0, len(b), 4000):
                  print("B64:" + b[i:i + 4000])
              print("=== END ===")
