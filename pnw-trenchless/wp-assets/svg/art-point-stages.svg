<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
        <defs>
          <linearGradient id="soilp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2533"/><stop offset="1" stop-color="#121B26"/></linearGradient>
        </defs>
        <rect width="1200" height="300" rx="22" fill="url(#soilp)"/>
        <!-- stage 1: sound pipe with one damaged joint -->
        <g transform="translate(40 110)">
          <rect y="10" width="340" height="60" rx="6" fill="#4A4F55"/>
          <rect y="20" width="340" height="40" fill="#262B31"/>
          <rect x="160" y="6" width="14" height="68" rx="2" fill="#5E6268"/>
          <path d="M150 10l12 14-8 10 14 12-6 14M178 70l-10-12 8-10" stroke="#0B121B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M174 52c12-4 20 6 30 2s16 6 24 4" stroke="#6CC08A" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
          <circle cx="167" cy="40" r="44" fill="none" stroke="#F0B03A" stroke-width="2" stroke-dasharray="5 6"/>
          <text x="0" y="122" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2" fill="#A8B3BF">01 · ONE DAMAGED SECTION</text>
        </g>
        <!-- stage 2: packer with the patch liner, inflated at the spot -->
        <g transform="translate(430 110)">
          <rect y="10" width="340" height="60" rx="6" fill="#4A4F55"/>
          <rect y="20" width="340" height="40" fill="#262B31"/>
          <path d="M0 40h110" stroke="#A8B3BF" stroke-width="2" stroke-dasharray="6 5"/>
          <rect x="110" y="22" width="130" height="36" rx="18" fill="#C8CDD2"/>
          <rect x="122" y="22" width="106" height="36" fill="#6CC08A" opacity=".85"/>
          <path d="M100 30l-10 10 10 10M250 30l10 10-10 10" stroke="#F0B03A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="0" y="122" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2" fill="#6CC08A">02 · PACKER + PATCH LINER</text>
        </g>
        <!-- stage 3: cured patch, rest of the pipe untouched -->
        <g transform="translate(820 110)">
          <rect y="10" width="340" height="60" rx="6" fill="#4A4F55"/>
          <rect y="20" width="340" height="40" fill="#262B31"/>
          <rect x="112" y="14" width="116" height="52" rx="4" fill="#2F7A4B"/>
          <rect x="112" y="20" width="116" height="40" fill="#1E3A2A"/>
          <path d="M140 40h60M186 32l14 8-14 8" stroke="#F0B03A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="0" y="122" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2" fill="#F0B03A">03 · CURED PATCH, PIPE SEALED</text>
        </g>
      </svg>
