<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
        <defs>
          <linearGradient id="soilw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2533"/><stop offset="1" stop-color="#121B26"/></linearGradient>
        </defs>
        <rect width="1200" height="300" rx="22" fill="url(#soilw)"/>
        <!-- stage 1: old galvanized line, rust and scale narrowing the bore -->
        <g transform="translate(40 110)">
          <rect y="10" width="340" height="60" rx="6" fill="#5E6268"/>
          <rect y="18" width="340" height="44" fill="#262B31"/>
          <path d="M0 18h340v10c-30 6-50-2-80 6s-60 2-90 8-50-4-80 2-60 6-90 0zM0 62h340v-12c-34-6-60 4-90-2s-50 6-84 0-60-6-90 2-54 2-76-2z" fill="#9A5A2E"/>
          <g fill="#C27A3E"><circle cx="70" cy="32" r="4"/><circle cx="160" cy="52" r="5"/><circle cx="250" cy="30" r="4"/><circle cx="300" cy="50" r="3"/></g>
          <g fill="#C8CDD2" opacity=".55"><rect x="110" y="6" width="8" height="68" rx="2"/><rect x="228" y="6" width="8" height="68" rx="2"/></g>
          <text x="0" y="122" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2" fill="#A8B3BF">01 · OLD LINE: RUST + SCALE</text>
        </g>
        <!-- stage 2: new CTS poly line pulled underground between two small pits -->
        <g transform="translate(430 70)">
          <path d="M0 40h340" stroke="#3A4656" stroke-width="2"/>
          <path d="M10 40h44v82H10zM286 40h44v82h-44z" fill="#0B121B"/>
          <rect x="14" y="26" width="36" height="14" rx="2" fill="#2B3747"/>
          <path d="M32 112h276" stroke="#2F6FD1" stroke-width="10" stroke-linecap="round"/>
          <path d="M32 112h276" stroke="#7FA9EA" stroke-width="2" stroke-dasharray="8 10" opacity=".8"/>
          <path d="M180 100l14 12-14 12" stroke="#F0B03A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="0" y="162" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2" fill="#6CC08A">02 · NEW CTS POLY PULLED IN</text>
        </g>
        <!-- stage 3: reconnected line, pressure and leak test -->
        <g transform="translate(820 110)">
          <rect y="26" width="250" height="28" rx="14" fill="#2F6FD1"/>
          <rect y="32" width="250" height="5" rx="2.5" fill="#7FA9EA" opacity=".6"/>
          <rect x="250" y="20" width="22" height="40" rx="4" fill="#C8CDD2"/>
          <path d="M272 40h20" stroke="#C8CDD2" stroke-width="8"/>
          <circle cx="314" cy="40" r="26" fill="#0B121B" stroke="#C8CDD2" stroke-width="4"/>
          <path d="M296 50a20 20 0 0 1 36 0" stroke="#3A4656" stroke-width="3" fill="none"/>
          <path d="M314 40l12-14" stroke="#F0B03A" stroke-width="3" stroke-linecap="round"/>
          <circle cx="314" cy="40" r="3.5" fill="#F0B03A"/>
          <path d="M60 74h160" stroke="#6CC08A" stroke-width="2" stroke-dasharray="2 8" opacity=".7"/>
          <text x="0" y="122" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2" fill="#F0B03A">03 · RECONNECTED + PRESSURE TESTED</text>
        </g>
      </svg>
