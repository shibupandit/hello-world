plugins {
    id 'com.android.application'
}

android {
    namespace 'online.thugtv.app'
    compileSdk 34

    defaultConfig {
        applicationId 'online.thugtv.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'thugtv123'
            keyAlias 'thugtv'
            keyPassword 'thugtv123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
